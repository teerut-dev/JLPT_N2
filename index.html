<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JLPT N2 Cards" />
  <title>JLPT N2 Flashcards (2,045 Words)</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-secondary: #eef0f4;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);
      --warn: #d97706;
      --warn-soft: rgba(217, 119, 6, 0.12);
      --ok: #059669;
      --ok-soft: rgba(5, 150, 105, 0.12);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --bg: #0b0d12;
      --surface: #151922;
      --surface-secondary: #1e2430;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2a3140;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.16);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.16);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.16);
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.16);
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Sukhumvit Set", "Thonburi", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      gap: 10px;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .progress-pill {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .theme-btn {
      appearance: none;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .theme-btn:hover, .theme-btn:focus {
      border-color: var(--accent);
      outline: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 6px;
    }

    select, button.ctrl-btn {
      appearance: none;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      min-width: 0;
    }

    select:focus, button.ctrl-btn:focus {
      border-color: var(--accent);
    }

    button.ctrl-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .card-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .card {
      width: 100%;
      height: 100%;
      max-height: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.992);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-muted);
    }

    .badge.tier-high {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.tier-mid {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 10px 0;
      overflow-y: auto;
    }

    .word {
      font-size: clamp(44px, 9vw, 68px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.02em;
      word-break: keep-all;
    }

    .reveal-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .card.revealed .reveal-box {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .reading {
      font-size: clamp(22px, 4.5vw, 30px);
      font-weight: 700;
      color: var(--accent);
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin: 2px 0;
    }

    .meaning-th {
      font-size: clamp(19px, 3.8vw, 25px);
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      max-width: 94%;
    }

    .meaning-en {
      font-size: clamp(15px, 3.2vw, 19px);
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-muted);
      max-width: 94%;
    }

    .tap-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card.revealed .tap-hint {
      visibility: hidden;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
      flex-shrink: 0;
    }

    button.act-btn {
      border: none;
      border-radius: 14px;
      padding: 13px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: opacity 0.12s ease, transform 0.1s ease;
    }

    button.act-btn:active {
      transform: scale(0.97);
    }

    button.act-btn span.sub {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.82;
    }

    .btn-again {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-unsure {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .btn-next {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .empty-state h2 {
      margin: 0;
      font-size: 22px;
    }

    .empty-state p {
      margin: 0;
      color: var(--text-muted);
      font-size: 15px;
    }

    .primary-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

  <div class="app">
    <header class="topbar">

      <button class="act-btn btn-next" id="nextBtn">

      </button>
    </footer>
  </div>

    // Theme initialization: Light is the factory default
    const themeBtn = document.getElementById('themeBtn');
    const STORAGE_THEME_KEY = 'jlpt_n2_theme';

    function applyTheme(theme) {
      const targetTheme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', targetTheme);
      themeBtn.textContent = targetTheme === 'dark' ? '🌙 Dark' : '☀️ Light';
      try {
        localStorage.setItem(STORAGE_THEME_KEY, targetTheme);
      } catch (err) {}
    }

    (function initTheme() {
      let savedTheme = 'light';
      try {
        const stored = localStorage.getItem(STORAGE_THEME_KEY);
        if (stored === 'dark' || stored === 'light') {
          savedTheme = stored;
        }
      } catch (err) {}
      applyTheme(savedTheme);
    })();

    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    let queue = [];
    let isRevealed = false;
    let isShuffled = false;
    let reviewedCount = 0;

    const tierFilter = document.getElementById('tierFilter');
    const stageFilter = document.getElementById('stageFilter');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const stageContainer = document.getElementById('stageContainer');
    const counter = document.getElementById('counter');
    const actionBar = document.getElementById('actionBar');

    function populateFilters() {
      const selectedTier = tierFilter.value || 'ALL';
      const selectedStage = stageFilter.value || 'ALL';

      // Tier counts based on currently selected stage
      const tierCounts = { ALL: 0, 'High Freq': 0, 'Mid Freq': 0, 'Low Freq': 0 };
      CARDS.forEach(c => {
        if (selectedStage === 'ALL' || c.s === Number(selectedStage)) {
          tierCounts.ALL++;
          tierCounts[c.t] = (tierCounts[c.t] || 0) + 1;
        }
      });

      tierFilter.innerHTML = `
        <option value="ALL">All Tiers (${tierCounts.ALL.toLocaleString()})</option>
        <option value="High Freq">High Freq (${tierCounts['High Freq'].toLocaleString()})</option>
        <option value="Mid Freq">Mid Freq (${tierCounts['Mid Freq'].toLocaleString()})</option>
        <option value="Low Freq">Low Freq (${tierCounts['Low Freq'].toLocaleString()})</option>
      `;
      tierFilter.value = selectedTier;

      // Stage list and counts based on currently selected tier
      const stageCounts = new Map();
      let totalStagesInTier = 0;
      CARDS.forEach(c => {
        if (selectedTier === 'ALL' || c.t === selectedTier) {
          stageCounts.set(c.s, (stageCounts.get(c.s) || 0) + 1);
          totalStagesInTier++;
        }
      });

      const sortedStages = Array.from(stageCounts.keys()).sort((a, b) => a - b);
      const minS = sortedStages.length ? sortedStages[0] : 1;
      const maxS = sortedStages.length ? sortedStages[sortedStages.length - 1] : 103;

      let stageHtml = `<option value="ALL">All Stages (${minS}–${maxS} · ${totalStagesInTier.toLocaleString()})</option>`;
      sortedStages.forEach(s => {
        const count = stageCounts.get(s);
        stageHtml += `<option value="${s}">Stage ${s} (${count} words)</option>`;
      });
      stageFilter.innerHTML = stageHtml;

      // Restore selected stage if still valid under new tier; otherwise reset to ALL
      if (selectedStage !== 'ALL' && stageCounts.has(Number(selectedStage))) {
        stageFilter.value = selectedStage;
      } else {
        stageFilter.value = 'ALL';
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildQueue() {
      const tVal = tierFilter.value || 'ALL';
      const sVal = stageFilter.value || 'ALL';

      let filtered = CARDS.filter(c => {
        const matchTier = tVal === 'ALL' || c.t === tVal;
        const matchStage = sVal === 'ALL' || c.s === Number(sVal);
        return matchTier && matchStage;
      });

      if (isShuffled) {
        filtered = shuffleArray(filtered);
      }

      queue = [...filtered];
      reviewedCount = 0;
      isRevealed = false;
      render();
    }

    function toggleReveal() {
      if (queue.length === 0) return;
      isRevealed = !isRevealed;
      const cardEl = document.getElementById('activeCard');
      if (cardEl) {
        cardEl.classList.toggle('revealed', isRevealed);
      }
    }

    function requeueCard(offset) {
      if (queue.length === 0) return;
      const current = queue.shift();
      const insertIndex = Math.min(offset, queue.length);
      queue.splice(insertIndex, 0, current);
      isRevealed = false;
      render();
    }

    function nextCard() {
      if (queue.length === 0) return;
      queue.shift();
      reviewedCount++;
      isRevealed = false;
      render();
    }

    function render() {
      const totalRemaining = queue.length;
      if (totalRemaining === 0) {
        counter.textContent = `Done (${reviewedCount} reviewed)`;
        actionBar.style.visibility = 'hidden';
        stageContainer.innerHTML = `
          <div class="card" style="cursor: default; justify-content: center;">
            <div class="empty-state">
              <h2>Session Complete</h2>
              <p>You went through all ${reviewedCount.toLocaleString()} cards in this filter.</p>
              <button class="primary-btn" onclick="buildQueue()">Review Again</button>
            </div>
          </div>
        `;
        return;
      }

      actionBar.style.visibility = 'visible';
      counter.textContent = `${totalRemaining.toLocaleString()} left · ${reviewedCount.toLocaleString()} done`;

      const card = queue[0];
      const tierClass = card.t === 'High Freq' ? 'tier-high' : (card.t === 'Mid Freq' ? 'tier-mid' : '');

      stageContainer.innerHTML = `
        <div class="card ${isRevealed ? 'revealed' : ''}" id="activeCard" onclick="toggleReveal()">
          <div class="card-header">
            <span class="badge">Stage ${card.s} · #${card.id}</span>
            <span class="badge ${tierClass}">${card.t}</span>
          </div>
          <div class="card-body">
            <div class="word">${card.w}</div>
            <div class="reveal-box">
              <div class="reading">${card.r}</div>
              <div class="divider"></div>
              <div class="meaning-th">${card.th}</div>
              <div class="meaning-en">${card.e}</div>
            </div>
          </div>
          <div class="tap-hint">Tap card or press Space to reveal</div>
        </div>
      `;
    }

    tierFilter.addEventListener('change', () => {
      populateFilters();
      buildQueue();
    });

    stageFilter.addEventListener('change', () => {
      populateFilters();
      buildQueue();
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffled = !isShuffled;
      shuffleBtn.textContent = isShuffled ? 'Shuffled' : 'Ordered';
      shuffleBtn.classList.toggle('active', isShuffled);
      buildQueue();
    });

    resetBtn.addEventListener('click', buildQueue);

    document.getElementById('againBtn').addEventListener('click', () => requeueCard(3));
    document.getElementById('unsureBtn').addEventListener('click', () => requeueCard(10));
    document.getElementById('nextBtn').addEventListener('click', nextCard);

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isRevealed) {
          toggleReveal();
        } else {
          nextCard();
        }
      } else if (e.key === '1' || e.code === 'Digit1' || e.code === 'Numpad1') {
        e.preventDefault();
        requeueCard(3);
      } else if (e.key === '2' || e.code === 'Digit2' || e.code === 'Numpad2') {
        e.preventDefault();
        requeueCard(10);
      } else if (e.key === '3' || e.code === 'Digit3' || e.code === 'Numpad3') {
        e.preventDefault();
        nextCard();
      }
    });

    populateFilters();
    buildQueue();
  </script>
</body>
</html>
